# =============================================================================
# منصة عمرو محروس التعليمية — development stack
#
#   docker compose up -d --build
#
# Every application service runs in a container. Host ports come from .env so
# they can be changed without editing this file. Infrastructure services are
# reachable on the host during development for debugging (psql, redis-cli,
# the MinIO console); docker-compose.prod.yml removes those publications.
# =============================================================================

name: amr-mahrous-platform

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  TZ: UTC
  LOG_LEVEL: ${LOG_LEVEL:-debug}

x-backend-env: &backend-env
  <<: *common-env
  PLATFORM_NAME: ${PLATFORM_NAME:-منصة مستر عمرو محروس التعليمية}
  TEACHER_NAME: ${TEACHER_NAME:-مستر عمرو محروس}
  SUBJECT_KEY: ${SUBJECT_KEY:-history}
  SUBJECT_NAME: ${SUBJECT_NAME:-التاريخ}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=10
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
  PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET}
  PLAYBACK_TOKEN_TTL: ${PLAYBACK_TOKEN_TTL:-300}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN-}
  CORS_ORIGINS: ${CORS_ORIGINS}
  PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
  S3_ENDPOINT: ${S3_ENDPOINT:-minio}
  S3_PORT: ${S3_PORT:-9000}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_VIDEOS: ${S3_BUCKET_VIDEOS:-amr-videos}
  S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-amr-public}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT-}
  S3_PUBLIC_PORT: ${S3_PUBLIC_PORT-}
  S3_PUBLIC_USE_SSL: ${S3_PUBLIC_USE_SSL-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5368709120}
  HLS_RENDITIONS: ${HLS_RENDITIONS}
  HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-6}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-dev}
  PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-EGP}
  PAYMOB_API_KEY: ${PAYMOB_API_KEY:-}
  PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:-}
  PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-}
  PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
  PAYMOB_INTEGRATION_ID_CARD: ${PAYMOB_INTEGRATION_ID_CARD:-}
  PAYMOB_INTEGRATION_ID_WALLET: ${PAYMOB_INTEGRATION_ID_WALLET:-}
  PAYMOB_IFRAME_ID: ${PAYMOB_IFRAME_ID:-}
  PAYMOB_BASE_URL: ${PAYMOB_BASE_URL:-https://accept.paymob.com}
  PHONE_VERIFICATION: ${PHONE_VERIFICATION:-off}
  SMS_PROVIDER: ${SMS_PROVIDER:-}
  SMS_API_KEY: ${SMS_API_KEY:-}
  SMS_SENDER_ID: ${SMS_SENDER_ID:-}
  PRESENCE_TTL_SECONDS: ${PRESENCE_TTL_SECONDS:-120}
  PRESENCE_HEARTBEAT_SECONDS: ${PRESENCE_HEARTBEAT_SECONDS:-45}
  RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-8}

services:
  # ---------------------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Arabic-aware collation for ORDER BY on Arabic titles.
      LANG: en_US.utf8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-7432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backplane]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-7379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [backplane]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-7900}:9000"
      - "${MINIO_CONSOLE_PORT:-7901}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [backplane]

  # ---------------------------------------------------------------------------
  # Migrations — runs to completion before the API starts.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    environment:
      <<: *backend-env
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backplane]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Applications
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-7400}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backplane]

  # Video transcoding. Separate container because ffmpeg is CPU-heavy and must
  # be scalable independently of the API (`docker compose up -d --scale worker=3`).
  worker:
    build:
      # Root context: the worker reuses backend/prisma rather than keeping a
      # second copy of the schema that could drift.
      context: .
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [backplane]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
        NEXT_PUBLIC_PRESENCE_HEARTBEAT_SECONDS: ${PRESENCE_HEARTBEAT_SECONDS:-45}
        NEXT_PUBLIC_PLATFORM_NAME: ${NEXT_PUBLIC_PLATFORM_NAME:-منصة مستر عمرو محروس التعليمية}
        NEXT_PUBLIC_PLATFORM_SHORT_NAME: ${NEXT_PUBLIC_PLATFORM_SHORT_NAME:-منصة عمرو محروس}
        NEXT_PUBLIC_PLATFORM_DESCRIPTION: ${NEXT_PUBLIC_PLATFORM_DESCRIPTION:-منصة تعليمية تجمع الشرح والمراجعة والمتابعة في مكان واحد.}
        NEXT_PUBLIC_TEACHER_NAME: ${NEXT_PUBLIC_TEACHER_NAME:-مستر عمرو محروس}
        NEXT_PUBLIC_TEACHER_SHORT_NAME: ${NEXT_PUBLIC_TEACHER_SHORT_NAME:-عمرو محروس}
        NEXT_PUBLIC_TEACHER_TITLE: ${NEXT_PUBLIC_TEACHER_TITLE:-مستر}
        NEXT_PUBLIC_TEACHER_TAGLINE: ${NEXT_PUBLIC_TEACHER_TAGLINE:-أسطورة التاريخ}
        NEXT_PUBLIC_SUBJECT_KEY: ${NEXT_PUBLIC_SUBJECT_KEY:-history}
        NEXT_PUBLIC_SUBJECT_NAME: ${NEXT_PUBLIC_SUBJECT_NAME:-التاريخ}
        NEXT_PUBLIC_SUBJECT_ADJECTIVE: ${NEXT_PUBLIC_SUBJECT_ADJECTIVE:-التاريخية}
        NEXT_PUBLIC_LOGO_LIGHT: ${NEXT_PUBLIC_LOGO_LIGHT:-/brand/horus-eye-logo-light.png}
        NEXT_PUBLIC_LOGO_DARK: ${NEXT_PUBLIC_LOGO_DARK:-/brand/horus-eye-logo.png}
        NEXT_PUBLIC_LOGO_ALT: ${NEXT_PUBLIC_LOGO_ALT:-شعار المنصة التعليمية}
        NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-https://facebook.com/}
        NEXT_PUBLIC_SUPPORT_WHATSAPP: ${NEXT_PUBLIC_SUPPORT_WHATSAPP:-201000000000}
        NEXT_PUBLIC_FOLLOWUP_WHATSAPP: ${NEXT_PUBLIC_FOLLOWUP_WHATSAPP:-201100000000}
        NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE:-201200000000}
        NEXT_PUBLIC_SUPPORT_WHATSAPP_LABEL: ${NEXT_PUBLIC_SUPPORT_WHATSAPP_LABEL:-010X XXX XXXX}
        NEXT_PUBLIC_FOLLOWUP_WHATSAPP_LABEL: ${NEXT_PUBLIC_FOLLOWUP_WHATSAPP_LABEL:-011X XXX XXXX}
        NEXT_PUBLIC_CONTACT_PHONE_LABEL: ${NEXT_PUBLIC_CONTACT_PHONE_LABEL:-012X XXX XXXX}
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Server-side calls go direct over the compose network, skipping the proxy.
      INTERNAL_API_URL: http://backend:4000/api
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-7300}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks: [backplane]

  # ---------------------------------------------------------------------------
  # Edge — single origin for the browser, so cookies are first-party.
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "${PROXY_HTTP_PORT:-7080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backplane]

  # ---------------------------------------------------------------------------
  # One-shot maintenance tasks (opt-in profiles, never started by `up`)
  # ---------------------------------------------------------------------------

  # docker compose --profile seed run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    profiles: ["seed"]
    environment:
      <<: *backend-env
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    command: ["node", "dist/prisma/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backplane]
    restart: "no"

  # docker compose --profile bootstrap run --rm bootstrap-admin
  bootstrap-admin:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    profiles: ["bootstrap"]
    environment:
      <<: *backend-env
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FULLNAME: ${BOOTSTRAP_ADMIN_FULLNAME:-}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
    command: ["node", "dist/prisma/bootstrap-admin.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backplane]
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  backplane:
    driver: bridge
