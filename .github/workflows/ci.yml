name: CI

# Runs on every pull request, and as Stage 1 of the Production pipeline
# (deploy.yml) after a merge into main. A pull request never publishes or
# deploys anything.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # A newer push to the same pull request replaces the older run; main is never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'
  # Prisma needs the variable at generate time; no connection is opened.
  DATABASE_URL: postgresql://build:build@localhost:5432/build

jobs:
  dependencies:
    name: CI - Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install from the lockfile and generate the Prisma client
        run: |
          npm ci --no-audit --no-fund
          npm --workspace backend run prisma:generate

  lint:
    name: CI - Lint
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm --workspace backend run prisma:generate
      - run: npm run lint

  typecheck:
    name: CI - Type-check (backend, frontend, worker)
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm --workspace backend run prisma:generate
      - run: npm run typecheck

  backend-tests:
    name: CI - Backend tests
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm --workspace backend run prisma:generate
      - run: npm --workspace backend test -- --runInBand

  frontend-tests:
    name: CI - Frontend model tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm --workspace backend run prisma:generate
      - run: npm run test:models

  asset-audit:
    name: CI - Asset audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:assets

  compose:
    name: CI - Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_PREFIX: ghcr.io/aboelhassan22omar/platform
      BACKEND_TAG: ${{ github.sha }}
      FRONTEND_TAG: ${{ github.sha }}
      WORKER_TAG: ${{ github.sha }}
      MINIO_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production compose stack and deploy script
        run: |
          cp .env.example .env
          bash -n scripts/deploy-production.sh
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.host.yml -f docker-compose.images.yml config --quiet

  image-build:
    name: CI - Container build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck, backend-tests, frontend-tests, asset-audit, compose]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
            dockerfile: backend/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - service: worker
            context: .
            dockerfile: workers/Dockerfile
          - service: minio
            context: docker/minio
            dockerfile: docker/minio/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: platform-${{ matrix.service }}:ci
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_SITE_URL=${{ vars.PRODUCTION_SITE_URL || 'https://amr.aurexis.cc' }}
            NEXT_PUBLIC_CONTACT_PHONE=${{ vars.PRODUCTION_CONTACT_PHONE || '201024066401' }}
            NEXT_PUBLIC_CONTACT_PHONE_LABEL=${{ vars.PRODUCTION_CONTACT_PHONE_LABEL || '01024066401' }}
            NEXT_PUBLIC_SUPPORT_WHATSAPP=${{ vars.PRODUCTION_CONTACT_PHONE || '201024066401' }}
            NEXT_PUBLIC_SUPPORT_WHATSAPP_LABEL=${{ vars.PRODUCTION_CONTACT_PHONE_LABEL || '01024066401' }}
            NEXT_PUBLIC_FOLLOWUP_WHATSAPP=${{ vars.PRODUCTION_CONTACT_PHONE || '201024066401' }}
            NEXT_PUBLIC_FOLLOWUP_WHATSAPP_LABEL=${{ vars.PRODUCTION_CONTACT_PHONE_LABEL || '01024066401' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Verify runtime image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          case "$SERVICE" in
            minio)
              docker run --rm platform-minio:ci --version
              docker run -d --name minio-smoke -e MINIO_ROOT_USER=ci-storage-user -e MINIO_ROOT_PASSWORD=ci-storage-password platform-minio:ci
              trap 'docker rm -f minio-smoke' EXIT
              for attempt in $(seq 1 30); do
                if docker exec minio-smoke curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then
                  exit 0
                fi
                sleep 2
              done
              docker logs minio-smoke
              exit 1
              ;;
            backend)
              docker run --rm -e DATABASE_URL=postgresql://build:build@localhost:5432/build platform-backend:ci node_modules/.bin/prisma --version
              docker run --rm platform-backend:ci node --check dist/src/main.js
              docker run --rm platform-backend:ci node --check dist/prisma/seed.js
              ;;
            frontend)
              docker run -d --name frontend-smoke platform-frontend:ci
              trap 'docker rm -f frontend-smoke' EXIT
              for attempt in $(seq 1 30); do
                if docker exec frontend-smoke node -e "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                  exit 0
                fi
                sleep 2
              done
              docker logs frontend-smoke
              exit 1
              ;;
            worker)
              docker run --rm platform-worker:ci ffmpeg -version
              docker run --rm platform-worker:ci node --check dist/transcode.worker.js
              ;;
            *) exit 1 ;;
          esac
