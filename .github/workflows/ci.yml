name: Stage 1 - CI and image build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    name: CI - ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, backend-tests, asset-audit]
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm --workspace backend run prisma:generate
      - name: Run check
        env:
          TASK: ${{ matrix.task }}
        run: |
          case "$TASK" in
            lint) npm run lint ;;
            typecheck) npm run typecheck ;;
            backend-tests) npm --workspace backend test -- --runInBand ;;
            asset-audit) npm run audit:assets ;;
            *) exit 1 ;;
          esac
  image-build:
    name: CI - Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
            dockerfile: backend/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - service: worker
            context: .
            dockerfile: workers/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_SITE_URL=${{ vars.PRODUCTION_SITE_URL || 'https://amr.aurexis.cc' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  compose:
    name: CI - Production Compose validation
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: ghcr.io/aboelhassan22omar/platform
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          bash -n scripts/deploy-production.sh
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.host.yml -f docker-compose.images.yml config --quiet
