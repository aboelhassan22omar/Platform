name: Mobile apps

# Builds the Google Play and App Store apps (mobile/, Capacitor).
#
# - On a pull request touching mobile/: both apps are compiled to prove they
#   build. Nothing is signed or uploaded.
# - Run manually (Actions -> Mobile apps -> Run workflow) to make store builds:
#     Android: a signed .aab, downloadable from the run ("Artifacts") and, once
#              the first version was uploaded by hand, sent to Play's internal
#              testing track automatically.
#     iOS:     signed in the cloud with the App Store Connect API key and
#              uploaded to TestFlight. No Mac needed.
#
# Every secret is listed, with where it comes from, in docs/store-apps/README.md.

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which app to build for the stores'
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  # Store builds need a number that only goes up; the run number does.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    name: Android (${{ github.event_name == 'workflow_dispatch' && 'store build' || 'build check' }})
    if: github.event_name == 'pull_request' || inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "Push notifications: on"
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set: this Android build has no push notifications."
          fi

      - name: Sync the web layer and plugins
        run: npx cap sync android

      - name: Version
        id: version
        run: echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build check (debug)
        if: github.event_name == 'pull_request'
        working-directory: mobile/android
        # The unsigned release bundle proves the store configuration builds too.
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Signing key
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing. See docs/store-apps/README.md (upload key)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Store build (signed .aab)
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease \
            -PversionCode=$((BUILD_NUMBER + 100)) \
            -PversionName=${{ steps.version.outputs.name }}
          mv app/build/outputs/bundle/release/app-release.aab \
            "$GITHUB_WORKSPACE/amr-mahrous-${{ steps.version.outputs.name }}-$((BUILD_NUMBER + 100)).aab"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: android-aab
          path: amr-mahrous-*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play (internal testing)
        # Google only accepts API uploads after the first version was uploaded by hand.
        if: github.event_name == 'workflow_dispatch' && env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.amrmahrous.app
          releaseFiles: amr-mahrous-*.aab
          track: internal
          status: completed

  ios:
    name: iOS (${{ github.event_name == 'workflow_dispatch' && 'TestFlight' || 'build check' }})
    if: github.event_name == 'pull_request' || inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # The App Store only takes builds from the current Xcode release.
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Sync the web layer and plugins
        run: npx cap sync ios

      - name: Version
        id: version
        run: echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build check (simulator, unsigned)
        if: github.event_name == 'pull_request'
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0

      - name: App Store Connect key
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64 TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. See docs/store-apps/README.md (App Store Connect API key)."
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Archive (signed in the cloud)
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=${{ steps.version.outputs.name }} \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            archive | tail -n 60

      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          sed "s/__TEAM_ID__/$TEAM_ID/" ../ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 60
          echo "Uploaded build $BUILD_NUMBER (version ${{ steps.version.outputs.name }}). It appears in App Store Connect -> TestFlight after Apple processes it (10-30 minutes)."
