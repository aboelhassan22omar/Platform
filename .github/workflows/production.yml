name: Production (owner approval required)

# A push only runs CI. The repository owner must explicitly start this workflow
# on main and type DEPLOY. No workflow_run/push trigger can publish production.
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type DEPLOY to approve publishing this main commit to production'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit approval from the repository owner on main
        env:
          APPROVAL: ${{ inputs.approval }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
        run: |
          test "$APPROVAL" = DEPLOY
          test "$ACTOR" = "$OWNER"
          test "$TRIGGERING_ACTOR" = "$OWNER"
          test "$REF" = refs/heads/main
  verify:
    needs: authorize
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH connection
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload immutable release and deploy
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$USER"
          release="/opt/amr-platform/releases/$GITHUB_SHA"
          git archive --format=tar.gz -o release.tar.gz HEAD
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "mkdir -p '$release'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes release.tar.gz "$USER@$HOST:$release/source.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "cd '$release' && tar -xzf source.tar.gz && bash scripts/deploy-production.sh '$GITHUB_SHA'"
      - name: Remove runner credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
