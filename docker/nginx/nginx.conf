# =============================================================================
# Reverse proxy — منصة عمرو محروس التعليمية
#
# Everything is served from ONE origin so auth cookies stay first-party:
#   /        -> Next.js frontend
#   /api/    -> NestJS backend
#
# Without this, the browser would treat the API as a third party and Safari's
# tracking prevention would drop the session cookie.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # The production edge is loopback-only behind the host's HTTPS nginx.
    # Preserve its protocol so the API receives HTTPS for secure sessions.
    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https https;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No `types` override is needed: nginx 1.27's bundled mime.types already
    # maps .m3u8 to application/vnd.apple.mpegurl and .ts to video/mp2t.
    # Re-declaring them only produces duplicate-extension warnings.

    # Log the real client IP rather than the proxy's.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;

    # Drop slow-header/body connections instead of letting them occupy workers.
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;
    large_client_header_buffers 4 16k;

    # Lesson videos are large; the API streams them through.
    client_max_body_size 50m;

    # --- Compression ---------------------------------------------------------
    # Text only. Video segments are already compressed, and gzipping them would
    # burn CPU for nothing.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/vnd.apple.mpegurl
        image/svg+xml
        font/woff2;

    # --- Rate limiting -------------------------------------------------------
    # A second layer in front of the application's own limiter, so a flood is
    # dropped at the edge before it reaches Node.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # --- Upstreams -----------------------------------------------------------
    # Docker can assign a new IP whenever a service is recreated. `resolve`
    # keeps nginx following the service DNS name instead of holding a stale IP
    # and returning 502 until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:3000 resolve;
        keepalive 32;
    }

    upstream backend_upstream {
        zone backend_upstream 64k;
        server backend:4000 resolve;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/production/*.conf;
}
