server {
    listen 80;
    server_name _;

    # ---- Security headers ---------------------------------------------------
    # CSP is deliberately not set here: the frontend emits its own in
    # next.config.ts, where the nonce/hash story is manageable.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
    # Browsers only honour this over HTTPS. Do not include subdomains until
    # every subdomain is confirmed HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_conn conn_zone 40;

    # ---- Proxy defaults -----------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "";
    proxy_hide_header X-Powered-By;

    # ---- Edge health --------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---- Auth endpoints -----------------------------------------------------
    # Tighter limit: these are the brute-force targets.
    location ~ ^/api/auth/(login|register|password) {
        limit_req zone=auth_zone burst=6 nodelay;
        proxy_pass http://backend_upstream;
        proxy_read_timeout 30s;
    }

    # ---- Video streaming ----------------------------------------------------
    # Long timeouts and NO buffering: segments must flow straight through, or
    # nginx would hold whole chunks in memory and add latency to seeking.
    location ~ ^/api/videos/.*/(manifest\.m3u8|hls/) {
        proxy_pass http://backend_upstream;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Paid media must never be cached by a shared proxy.
        add_header Cache-Control "private, no-store" always;
    }

    # ---- Payment webhooks ---------------------------------------------------
    # Never rate-limited: dropping a provider callback would leave a student
    # who paid without access.
    location = /api/webhooks/payments {
        proxy_pass http://backend_upstream;
        proxy_read_timeout 30s;
    }

    # ---- API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://backend_upstream;
        proxy_read_timeout 60s;
    }

    # ---- Next.js immutable assets -------------------------------------------
    # Content-hashed filenames, so a long cache is safe.
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---- Frontend -----------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_read_timeout 60s;
    }
}
